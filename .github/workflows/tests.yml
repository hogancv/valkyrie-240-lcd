name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: 协议常量自检 (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow

      - name: 编译检查（全部 .py 语法）
        run: python -m compileall -q valkyrie_lcd examples demos tools tests

      - name: 单元测试
        # 协议层 / 渲染层都不依赖 USB 与 Windows，可以在 Linux 上跑
        run: python -m unittest discover -s tests -v
